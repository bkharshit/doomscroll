<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Doomscroll - Lockout Screen</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for modern typography -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            tactile: {
              bg: '#f0f3f8',
              surface: '#f6f8fc',
              dark: '#1e2430',
              muted: '#717d96',
              accent: '#ff5a43',
              emerald: '#10b981',
              emeraldDark: '#059669',
              lightShadow: '#ffffff',
              darkShadow: '#d3d9e4',
              groove: '#e2e7f0',
            }
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Neomorphic Styles -->
<style data-purpose="neomorphic-shadows">
    /* Tactile Neomorphic soft light extrusion effects */
    .neo-extruded {
      background: #f0f3f8;
      box-shadow: 8px 8px 18px #d1d8e5, -8px -8px 18px #ffffff;
    }
    
    .neo-extruded-subtle {
      background: #f0f3f8;
      box-shadow: 5px 5px 12px #d5dce8, -5px -5px 12px #ffffff;
    }

    .neo-recessed {
      background: #eef2f7;
      box-shadow: inset 4px 4px 8px #d1d8e5, inset -4px -4px 8px #ffffff;
    }

    .neo-recessed-deep {
      background: #eaeff5;
      box-shadow: inset 5px 5px 10px #c9d2e0, inset -5px -5px 10px #ffffff;
    }

    .neo-btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 10px 24px -4px rgba(16, 185, 129, 0.42), 
                  6px 6px 14px #cad3e0, 
                  -6px -6px 14px #ffffff;
    }

    .neo-btn-primary:active {
      transform: scale(0.985);
      box-shadow: 0 4px 12px -2px rgba(16, 185, 129, 0.5), 
                  inset 2px 2px 5px rgba(0, 0, 0, 0.2);
    }

    .neo-btn-secondary {
      background: #f0f3f8;
      box-shadow: 6px 6px 14px #d3d9e4, -6px -6px 14px #ffffff;
    }

    .neo-btn-secondary:active {
      box-shadow: inset 3px 3px 6px #d1d8e5, inset -3px -3px 6px #ffffff;
    }

    /* Ambient pulse animation for the mindful breathing sphere */
    @keyframes gentle-breath {
      0%, 100% {
        transform: scale(0.96);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.2);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 0 16px rgba(16, 185, 129, 0.05);
      }
    }

    .animate-gentle-breath {
      animation: gentle-breath 4.8s ease-in-out infinite;
    }
  </style>
<!-- END: Custom Neomorphic Styles -->
</head>
<body class="bg-tactile-bg text-tactile-dark font-sans min-h-screen flex justify-center items-center p-0 sm:p-4 select-none antialiased">
<!-- BEGIN: MobileDeviceFrame -->
<!-- Constrained mobile frame for realistic iOS / Android preview -->
<main class="w-full max-w-md min-h-screen sm:min-h-[850px] sm:max-h-[920px] bg-tactile-bg sm:rounded-[46px] relative flex flex-col justify-between overflow-hidden shadow-2xl border-0 sm:border-[8px] sm:border-slate-200/60" data-purpose="mobile-lockout-container">
<!-- BEGIN: MobileStatusBar -->
<header class="w-full pt-3 px-7 pb-2 flex justify-between items-center text-xs font-semibold text-slate-500 tracking-tight z-20" data-purpose="ios-status-bar">
<!-- Time -->
<span class="tracking-normal font-bold text-slate-700">18:16</span>
<!-- Dynamic Island / Sensor Notch Placeholder -->
<div class="h-4 w-24 bg-slate-900/10 rounded-full mx-auto hidden sm:block neo-recessed opacity-40"></div>
<!-- Device Indicators (Cellular, Wifi, Battery) -->
<div class="flex items-center space-x-2 text-slate-700">
<!-- Cellular Icon -->
<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25c-.2.2-.2.51 0 .71.1.1.23.15.35.15.13 0 .26-.05.35-.15l.65-.65C7.26 19.47 9.51 20.2 12 20.2s4.74-.73 6.3-1.89l.65.65c.1.1.23.15.35.15.13 0 .26-.05.35-.15.2-.2.2-.51 0-.71l-.62-.64C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.3"></path>
<path d="M2 17h3v4H2zm5-4h3v8H7zm5-4h3v12h-3zm5-5h3v17h-3z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
<path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
<path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
<line x1="12" x2="12.01" y1="20" y2="20"></line>
</svg>
<!-- Battery with status -->
<div class="flex items-center gap-1 font-semibold text-[11px]">
<span>17%</span>
<div class="w-5 h-2.5 rounded-sm border border-slate-700/80 p-0.5 flex items-center">
<div class="w-1.5 h-full bg-tactile-accent rounded-xs"></div>
</div>
</div>
</div>
</header>
<!-- END: MobileStatusBar -->
<!-- BEGIN: MainContent -->
<div class="flex-1 flex flex-col px-6 pt-3 z-10 gap-3 justify-center">
<!-- BEGIN: HeroLockoutSection -->
<section class="flex flex-col items-center text-center" data-purpose="hero-section">
<!-- Tactile Brand Badge with Recessed Infinity Mark -->
<div class="relative group mt-1">
<!-- Outer extruded pillow -->
<div class="w-24 h-24 rounded-3xl neo-extruded flex items-center justify-center p-3.5 transition-transform duration-300">
<!-- Recessed tactile inner core -->
<div class="w-full h-full rounded-2xl neo-recessed flex items-center justify-center p-2.5 overflow-hidden bg-slate-900 border border-slate-800">
<!-- Provided Infinity Brand Icon https://lh3.googleusercontent.com/aida-public/AB6AXuC5s6x21leguD3v4jJ5yCl7v7d77twBP1b4DOP8413hmy-Khl0A9YHJwZO2ZWBY1HtTfpzHf0tjooWWX7WeXuZP6THPkt3BjPfbADrrAhRH7Se-zX8hdt9sUQTAZKhMHqW0GHgbGE18XxAZMP3RwvD7gFPHzRvJb_CWgYiycCV186nCyC9wiI7PJohSEiRCh2AjJpcSeKgN6UL15rIxtXYo1qeeso07EuZj4_ttzMC63f4hy-2i4y-_OQ -->
<img alt="Doomscroll Infinity Brand Mark" class="w-full h-full object-contain filter drop-shadow-sm transform hover:scale-105 transition-transform duration-300" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5s6x21leguD3v4jJ5yCl7v7d77twBP1b4DOP8413hmy-Khl0A9YHJwZO2ZWBY1HtTfpzHf0tjooWWX7WeXuZP6THPkt3BjPfbADrrAhRH7Se-zX8hdt9sUQTAZKhMHqW0GHgbGE18XxAZMP3RwvD7gFPHzRvJb_CWgYiycCV186nCyC9wiI7PJohSEiRCh2AjJpcSeKgN6UL15rIxtXYo1qeeso07EuZj4_ttzMC63f4hy-2i4y-_OQ">
</div>
</div>
<!-- Ambient breathing ring aura -->
<div class="absolute -inset-1 rounded-3xl bg-emerald-500/10 blur-md -z-10 animate-gentle-breath"></div>
</div>
<!-- Headline & Calming Subtext -->
<h1 class="text-3xl font-extrabold text-slate-800 tracking-tight mt-2">
          Take a breath.
        </h1>

<!-- Tactile Mindful Breath Indicator Pill -->

</section>
<!-- END: HeroLockoutSection -->
<!-- BEGIN: QuotaDetailsCard -->
<section class="my-2" data-purpose="quota-summary-card">
<!-- Main extruded tactile card -->
<div class="neo-extruded rounded-3xl p-5 border border-white/80">
<!-- App Header within card -->
<div class="flex items-center justify-between pb-3 border-b border-slate-200/70">
<div class="flex items-center gap-3">
<!-- Instagram Icon Neo Badge -->
<div class="w-11 h-11 rounded-2xl neo-extruded flex items-center justify-center bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 p-0.5 shadow-sm">
<div class="w-full h-full rounded-[14px] bg-white flex items-center justify-center">
<!-- Instagram SVG icon -->
<svg class="w-5 h-5 text-rose-600" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"></path>
</svg>
</div>
</div>
<div class="text-left">
<div class="flex items-center gap-1.5">
<span class="font-bold text-slate-800 text-base">Instagram</span>
<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-tactile-accent/15 text-tactile-accent">LOCKED</span>
</div>

</div>
</div>
<!-- Limit indicator percentage -->
<div class="text-right">
<span class="text-xs font-bold text-tactile-accent bg-rose-50 px-2 py-1 rounded-full border border-rose-200">112% Quota</span>
</div>
</div>
<!-- Usage limit details text -->
<div class="mt-3.5 mb-2 flex justify-between items-baseline">
<span class="text-xs font-semibold text-slate-600">Daily limit of 85m reached</span>
<span class="text-xs font-bold text-slate-800">95m used</span>
</div>
<!-- Neomorphic Recessed Dual-toned Progress Bar -->
<div class="w-full h-3 rounded-full neo-recessed p-0.5 relative overflow-hidden" data-purpose="progress-container">
<div class="h-full rounded-full bg-gradient-to-r from-emerald-500 via-amber-400 to-tactile-accent w-[100%] shadow-sm"></div>
</div>
<!-- Tactile Metric Badges Row -->
<div class="grid grid-cols-2 gap-3 mt-4 pt-3 border-t border-slate-200/70">
<!-- Intercepts stat -->
<div class="neo-recessed rounded-xl p-2.5 flex items-center gap-2.5">
<div class="w-7 h-7 rounded-lg neo-extruded flex items-center justify-center text-tactile-emerald">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<div class="text-[10px] text-slate-500 uppercase font-semibold">Intercepts</div>
<div class="text-xs font-bold text-slate-700">14 times today</div>
</div>
</div>
<!-- Time Saved stat -->
<div class="neo-recessed rounded-xl p-2.5 flex items-center gap-2.5">
<div class="w-7 h-7 rounded-lg neo-extruded flex items-center justify-center text-tactile-accent">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<div class="text-[10px] text-slate-500 uppercase font-semibold">Time Saved</div>
<div class="text-xs font-bold text-slate-700">45m reclaimed</div>
</div>
</div>
</div>
</div>
</section>
<!-- END: QuotaDetailsCard -->
<!-- BEGIN: ActionButtonsGroup -->
<section class="flex flex-col gap-2.5" data-purpose="user-actions">
<!-- Primary Action: Return to Home Screen (Embossed vibrant Green button inspired by Image 2 and tactile buttons in Image 18) -->
<button class="neo-btn-primary w-full py-4 px-6 rounded-2xl text-white font-bold text-base flex items-center justify-center gap-3 transition-all duration-200 cursor-pointer" data-purpose="primary-action-home" type="button">
<!-- Home Icon -->
<svg class="w-5 h-5 filter drop-shadow" fill="currentColor" viewBox="0 0 20 20">
<path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
</svg>
<span class="tracking-wide text-[15px]">Return to Home Screen</span>
</button>
<!-- Secondary Mindful Friction Action: 5 minutes request -->
<button class="neo-btn-secondary w-full py-3.5 px-6 rounded-2xl text-slate-700 font-semibold text-sm flex items-center justify-center gap-2.5 transition-all duration-200 border border-slate-200/50 hover:text-slate-900 cursor-pointer" data-purpose="friction-action-extension" type="button">
<!-- Timer Icon -->
<svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M9 2h6m-3 0v2" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-slate-600">I need 5 minutes intentionally</span>
</button>
<!-- Subtle Mindful Wisdom Footer -->
<p class="text-center text-[11px] text-slate-400 font-medium tracking-wide mt-1">
          “Be intentional with your precious time.”
        </p>
</section>
<!-- END: ActionButtonsGroup -->
</div>
<!-- END: MainContent -->
<!-- BEGIN: HomeIndicator -->
<!-- Native iOS home indicator pill -->
<footer class="w-full pb-2 pt-1 flex justify-center items-center z-20" data-purpose="home-indicator">
<div class="w-32 h-1 bg-slate-400/50 rounded-full neo-recessed"></div>
</footer>
<!-- END: HomeIndicator -->
</main>
<!-- END: MobileDeviceFrame -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="mindful-interactions">
    // Subtle tactile interaction handlers for demo feel
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('touchstart', () => {
        button.style.transform = 'scale(0.98)';
      });
      button.addEventListener('touchend', () => {
        button.style.transform = 'scale(1)';
      });
    });
  </script>
<!-- END: InteractiveScripts -->


</body></html>
